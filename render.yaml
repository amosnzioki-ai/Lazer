# Public, fictional-data demo only. The private HR API/database are not deployed.
services:
  - type: web
    name: kisc-peoplehub-demo
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:website
    staticPublishPath: ./website-dist
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
